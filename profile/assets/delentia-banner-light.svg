<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="50%" style="stop-color:#EFF6FF"/>
      <stop offset="100%" style="stop-color:#F1F5F9"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glow-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur-light">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg-light)"/>

  <!-- Glow effect -->
  <ellipse cx="280" cy="160" rx="350" ry="180" fill="url(#glow-light)" filter="url(#blur-light)"/>

  <!-- Tech grid pattern (Left/Center area) -->
  <g fill="#3B82F6" opacity="0.12">
    <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/><circle cx="240" cy="60" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="180" cy="120" r="1.5"/><circle cx="240" cy="120" r="1.5"/>
    <circle cx="60" cy="180" r="1.5"/><circle cx="120" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/><circle cx="240" cy="180" r="1.5"/>
    <circle cx="60" cy="240" r="1.5"/><circle cx="120" cy="240" r="1.5"/><circle cx="180" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent-light)"/>

  <!-- Logo Icon: Beautiful Vector Delta Symbol (Δ) on the left -->
  <g transform="translate(80, 55)">
    <!-- Outer hexagonal tech border -->
    <polygon points="25,0 75,0 100,43 75,86 25,86 0,43" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.25"/>
    <polygon points="22,-3 78,-3 105,43 78,89 22,89 -5,43" fill="none" stroke="#3B82F6" stroke-dasharray="10, 15" stroke-width="1" opacity="0.4"/>
    <!-- Central Delta Glyph (Δ) -->
    <path d="M 50 18 L 80 70 L 20 70 Z" fill="none" stroke="url(#accent-light)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 50 18 L 80 70 L 20 70 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Delentia Labs</text>
  <text x="430" y="104" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="3">INTENT-CENTRIC AI OS</text>

  <!-- Tagline / Title -->
  <text x="210" y="165" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#1E40AF">verifiable mathematical governance kernel</text>
  <text x="210" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#accent-light)" letter-spacing="-1.5">F = D^I × A</text>

  <!-- Tagline footer -->
  <text x="210" y="255" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569">Pedersen ZK-FDIA Proofs · JITNA v3 WebSocket Streaming · Helix-TTD 8D Drift</text>

  <!-- Right side panel: 10-Layer Stack -->
  <rect x="760" y="35" width="460" height="250" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" opacity="0.95"/>
  <rect x="760" y="35" width="460" height="40" rx="14" fill="#DBEAFE" opacity="0.6"/>
  <rect x="760" y="55" width="460" height="20" fill="#DBEAFE" opacity="0.6"/>
  <text x="785" y="60" font-family="monospace" font-size="12" font-weight="bold" fill="#1E40AF" letter-spacing="2">DELENTIA OS 10-LAYER STACK</text>

  <!-- Layers -->
  <text x="785" y="98" font-family="monospace" font-size="11.5" fill="#2563EB">L10-L8</text>
  <text x="840" y="98" font-family="monospace" font-size="11.5" fill="#334155">CI Quality (1,791 tests) · Signed JITNA v3</text>

  <text x="785" y="123" font-family="monospace" font-size="11.5" fill="#2563EB">L7-L6</text>
  <text x="840" y="123" font-family="monospace" font-size="11.5" fill="#334155">Ecosystem Registry · 10+ Channel Adapters</text>

  <text x="785" y="148" font-family="monospace" font-size="11.5" fill="#2563EB">L5</text>
  <text x="840" y="148" font-family="monospace" font-size="11.5" fill="#334155">SignedAI Consensus (2.8% Hallucination)</text>

  <text x="785" y="148" font-family="monospace" font-size="11.5" fill="#2563EB">L5</text>

  <text x="785" y="173" font-family="monospace" font-size="11.5" fill="#2563EB">L4-L3</text>
  <text x="840" y="173" font-family="monospace" font-size="11.5" fill="#334155">Delta Engine (91.5% Comp) · Helix-TTD 8D</text>

  <text x="785" y="198" font-family="monospace" font-size="11.5" fill="#2563EB">L2-L1</text>
  <text x="840" y="198" font-family="monospace" font-size="11.5" fill="#2563EB" font-weight="bold">FDIA core kernel · RCTDB memory loop</text>

  <!-- Safety statement box -->
  <rect x="785" y="215" width="410" height="52" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="800" y="235" font-family="monospace" font-size="11.5" fill="#7C3AED" font-weight="bold">Verification Gate Status: Active</text>
  <text x="800" y="252" font-family="monospace" font-size="10.5" fill="#4B5563">When Human Gate A = 0, output blocks mathematically.</text>

  <!-- Bottom accent line -->
  <rect x="0" y="315" width="1280" height="5" fill="url(#accent-light)"/>

  <!-- Footer text -->
  <text x="80" y="295" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#64748B">© 2026 Delentia Labs · Constitutional AI OS · Bangkok, Thailand 🇹🇭 · delentia.com</text>
</svg>
